<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作业批改 · 复核工作台</title>
<style>
:root{--ink:#213547;--muted:#71808d;--line:#e1e7eb;--blue:#245cc5;--bg:#f5f7fa;--green:#247153}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:7px;padding:10px 17px;color:var(--ink)}button:hover{background:#edf2f9}button:disabled{opacity:.5;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#194aa6}input,textarea{border:1px solid #cbd5df;border-radius:7px;padding:12px;color:var(--ink);background:white}input:focus,textarea:focus{outline:2px solid #abc6f6;outline-offset:2px}header{background:white;border-bottom:1px solid var(--line);padding:18px 36px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700;font-size:18px}.badge{font-size:12px;background:#fff3d8;color:#836326;padding:4px 10px;border-radius:5px}main{max-width:1280px;padding:22px 32px;margin:auto}h1{font-size:28px;letter-spacing:-.5px;margin:0 0 6px}h2{font-size:19px;margin:0}h3{font-size:14px;margin:0 0 12px}p{margin:6px 0}.muted{color:var(--muted)}.intro{margin-bottom:16px}.panel{background:white;border:1px solid var(--line);border-radius:12px}.start{padding:16px 24px}.link-row{display:flex;gap:12px;margin-top:6px}.link-row input{flex:1;min-width:0}.steps{display:flex;gap:32px;border-top:1px solid var(--line);margin-top:20px;padding-top:16px;font-size:13px;color:var(--muted)}.steps b{color:var(--blue);margin-right:7px}.notice{color:#82652f;background:#fff8ea;padding:10px 14px;border-radius:6px;font-size:12px;margin-top:14px}.summary{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.summary strong{color:var(--green)}.workbench{display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;min-height:490px}.queue{border-right:1px solid var(--line);background:#fbfcfd;padding:20px 12px}.queue h3{padding:0 10px}.student{width:100%;text-align:left;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;margin:3px 0;padding:14px 12px;background:transparent}.student.active{background:#edf3ff;border-color:#cdddfb}.student small{display:block;color:var(--muted);font-size:12px}.status{font-size:12px;color:var(--muted)}.status.done{color:var(--green)}.status.warning{color:#966b22}.review{padding:26px 30px}.review-heading{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.review-fields{display:grid;grid-template-columns:160px 1fr;gap:24px;margin-top:24px}label{display:block;font-weight:600;margin-bottom:8px}.score{width:105px;font-size:34px;font-weight:600;padding:8px 12px}.outof{color:var(--muted);margin-left:6px}textarea{width:100%;resize:vertical;min-height:190px;line-height:1.8}.help{font-size:12px;color:var(--muted);margin-top:9px}.evidence{margin:22px 0;background:#f6f8fb;border-radius:8px;padding:14px 18px}.evidence summary{cursor:pointer;font-weight:600}.evidence p{font-size:13px;margin-top:12px;white-space:pre-line}.actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:22px;gap:16px}.actions .primary{min-width:165px}.empty{text-align:center;padding:58px 24px;margin-top:24px}.empty .symbol{font-size:28px;color:#8399b6;margin-bottom:12px}.progress{margin-top:18px;color:var(--blue)}#feedback{min-height:25px;margin-top:14px;color:var(--green)}#error{color:#b34238}.warning-box{background:#fff5df;color:#8d6823;padding:10px 14px;border-radius:6px;margin-top:18px}[hidden]{display:none!important}@media(max-width:760px){header{padding:16px}main{padding:20px 14px}.link-row{flex-wrap:wrap}.link-row input{flex-basis:100%}.steps{gap:12px;flex-wrap:wrap}.workbench{grid-template-columns:1fr}.queue{border-right:0;border-bottom:1px solid var(--line)}.student{display:inline-flex;width:calc(50% - 6px)}.review{padding:20px}.review-fields{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}.summary{align-items:flex-start;gap:10px}.badge{margin-left:10px}}
.question-review{margin:22px 0}.question-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.question-tabs button.active{background:#edf3ff;border-color:#a9c4f1;color:var(--blue)}.question-original{padding:8px 12px;background:#f6f8fb;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}.source{font-size:12px;color:var(--muted);margin:0 0 10px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.answer-card{border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}.answer-card.reference{background:#f5faf7;border-color:#d4e6db}.answer-copy{white-space:pre-wrap;line-height:1.9;margin:0}.answer-copy mark{background:#ffe3db;color:#923d2a;padding:2px 4px;border-radius:3px}.deduction{border-left:3px solid #cd7856;background:#fff7f1;margin-top:12px;padding:12px 16px}.deduction p{margin:4px 0}.question-review h3{margin-bottom:4px}@media(max-width:950px){.workbench{grid-template-columns:minmax(0,1fr)}.queue{border-right:0;border-bottom:1px solid var(--line);padding:12px}.student{display:inline-flex;width:calc(50% - 6px)}.review{min-width:0;padding:20px}.answer-card{padding:12px}}
.scan-stage{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f6f7f9;border:1px dashed #c8d1da;border-radius:6px;color:var(--muted);padding:10px;gap:12px}.scan-button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.scan-button img{display:block;width:100%;height:auto}.answer-card input[type=file]{display:block;max-width:100%;font-size:12px;padding:6px;margin-top:8px}dialog{width:92vw;max-width:1400px;max-height:92vh;border:1px solid var(--line);border-radius:12px;padding:20px;color:var(--ink)}dialog::backdrop{background:#182637b3}.viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:16px}.scan-scroll{overflow:auto;max-height:73vh;background:#edf0f3}.scan-scroll img{display:block;max-width:none;margin:auto}
.real-comparison{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:16px;align-items:start}@media(max-width:650px){.real-comparison{grid-template-columns:1fr}}
.action-buttons{display:flex;gap:12px;align-items:center;flex-shrink:0}
.question-original summary{cursor:pointer;font-weight:600}.question-original[open] summary{margin-bottom:10px}
.question-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;font-size:13px}.next-question{padding:4px 8px;border:0;background:transparent;color:var(--blue);font-size:13px}
.model-comparison{margin:16px 0;padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:#f6f8fb}.model-comparison summary{cursor:pointer;font-weight:600}
.student-picker{font:600 19px system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:white;border:1px solid var(--line);border-radius:7px;padding:8px 12px;max-width:65%;cursor:pointer}
.header-left{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.assignment-picker{display:flex;align-items:center;gap:8px}.assignment-picker label{font-size:13px;margin:0;color:var(--muted)}.assignment-picker select{font:inherit;color:var(--ink);background:white;border:1px solid var(--line);border-radius:7px;padding:8px 12px;max-width:260px}
</style>
</head>
<body>
<!-- Local review prototype. Real read-only results and synthetic demo are separate; Canvas submission is not integrated. -->
<header><div class="header-left"><div class="assignment-picker"><label for="assignmentDate">作业日期</label><select id="assignmentDate" disabled><option value="">正在加载作业…</option></select></div><div class="brand">Canvas <span class="muted">/</span> Agent 批改，你来确认</div></div><span class="badge">作业复核工作台</span></header>
<main data-screen-label="作业复核工作台">
<form id="startForm" class="panel start">
<label for="assignment">本次作业链接</label>
<div class="link-row"><input id="assignment" type="url" required placeholder="https://oc.sjtu.edu.cn/courses/…/assignments/…"><button class="primary" id="start" type="submit">批量修改作业</button><button id="missingButton" type="button" hidden>未提交</button></div>
<p id="error" role="alert"></p><p id="progress" class="progress" role="status" hidden></p>
</form>
<section id="empty" class="panel empty"><div class="symbol">待开始</div><h2>把下一份作业交给 Agent</h2><p class="muted">完成批改后，学生的建议评分和评语会出现在这里。</p></section>

<section id="workspace" style="margin-top:16px" hidden>
<div class="panel workbench"><article class="review" id="review"></article></div>
</section>
<p id="feedback" role="status" aria-live="polite"></p>
</main>
<dialog id="scanViewer" aria-labelledby="scanTitle"><div class="viewer-bar"><strong id="scanTitle"></strong><button type="button" onclick="document.getElementById('scanViewer').close()">关闭预览</button></div><p class="help">原图显示，可滚动查看；按 Esc 关闭。</p><div class="scan-scroll"><img id="fullScan" alt=""></div></dialog>
<script src="error-review.js?v=confirm-submit-20260924"></script>
</body>
</html>
