[project]
name = "canvas-homework-grading"
version = "0.1.0"
description = "Canvas TA grading app V1 for oc.sjtu.edu.cn"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pynacl>=1.5.0",
  "aiofiles>=24.1.0",
  "Pillow>=10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
